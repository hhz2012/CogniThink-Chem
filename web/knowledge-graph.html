<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>知识图谱 · 知识点与规则串联原型 | CogniThink-Chem</title>
<style>
:root {
  --bg: #f5f7fa;
  --panel: #ffffff;
  --border: #dfe3ea;
  --text: #1a2332;
  --muted: #6b7785;
  --brand: #2563eb;
  --brand-soft: #eff6ff;
  --rule: #7c3aed;
  --rule-soft: #f5f0ff;
  --accent: #f59e0b;
  --ok: #16a34a;
  --dim: rgba(0,0,0,0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }

header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 16px 24px; }
header h1 { font-size: 20px; }
header p { color: var(--muted); font-size: 13px; margin-top: 4px; }

.layout { display: grid; grid-template-columns: 1fr 340px; gap: 16px; padding: 16px; height: calc(100vh - 76px); }

.graph-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
.search-bar { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
.search-bar input { flex: 1; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
.search-bar input:focus { border-color: var(--brand); }
.search-bar button { padding: 10px 20px; background: var(--brand); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
.search-bar button:hover { background: #1d4ed8; }
.legend { padding: 8px 16px; display: flex; gap: 16px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); }
.legend span { display: flex; align-items: center; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot.kn { background: var(--brand); }
.dot.rule { background: var(--rule); }
.dot.match { background: var(--accent); }

#graph { flex: 1; position: relative; }
#graph svg { width: 100%; height: 100%; }
.node circle { cursor: pointer; transition: r 0.2s; }
.node text { font-size: 10px; pointer-events: none; text-anchor: middle; }
.node.kn circle { fill: var(--brand); stroke: #fff; stroke-width: 1.5px; }
.node.rule circle { fill: var(--rule); stroke: #fff; stroke-width: 1.5px; }
.node.dim circle { fill: var(--dim); }
.node.dim text { fill: #ccc; }
.node.match circle { fill: var(--accent); stroke: var(--accent); stroke-width: 3px; r: 14; }
.node.connected circle { stroke: var(--accent); stroke-width: 2.5px; }
.edge { stroke: #c5cad3; stroke-width: 1; }
.edge.prereq { stroke-dasharray: none; }
.edge.owner { stroke-dasharray: 4 3; }
.edge.dim { stroke: var(--dim); }
.edge.highlight { stroke: var(--accent); stroke-width: 2; }

.detail-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow-y: auto; padding: 16px; }
.detail-panel h3 { font-size: 15px; margin-bottom: 8px; }
.detail-panel .empty { color: var(--muted); font-size: 13px; text-align: center; margin-top: 40px; }
.badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-family: monospace; }
.badge.kn { background: var(--brand-soft); color: var(--brand); }
.badge.rule { background: var(--rule-soft); color: var(--rule); }
.detail-row { margin: 10px 0; font-size: 13px; line-height: 1.6; }
.detail-row b { color: var(--text); }
.detail-row p { color: #333; }
.conn-list { margin-top: 8px; }
.conn-chip { display: inline-block; padding: 3px 10px; margin: 2px; border-radius: 12px; font-size: 11px; cursor: pointer; border: 1px solid var(--border); }
.conn-chip.kn { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); }
.conn-chip.rule { background: var(--rule-soft); color: var(--rule); border-color: var(--rule); }
.conn-chip:hover { opacity: 0.8; }
.chain-view { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 10px; margin: 10px 0; font-size: 12px; }
.chain-view .step { padding: 4px 0; }
.chain-view .arrow { color: var(--accent); margin: 0 6px; }

.stats { display: flex; gap: 12px; padding: 8px 16px; background: #f9fafb; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.stats b { color: var(--text); }
</style>
</head>
<body>

<header>
  <h1>🔗 知识图谱 · 知识点与规则串联原型</h1>
  <p>输入化学问题，系统自动检索相关知识点（蓝）与规则（紫），并展示它们之间的前置依赖与归属关系。点击节点查看详情。</p>
</header>

<div class="layout">
  <div class="graph-panel">
    <div class="search-bar">
      <input id="qInput" type="search" placeholder="例如：苯能使溴水褪色吗？什么是勒夏特列原理？原电池和电解池的区别？" />
      <button id="qBtn">提问</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="legend">
      <span><span class="dot kn"></span> 知识点</span>
      <span><span class="dot rule"></span> 规则</span>
      <span><span class="dot match"></span> 命中高亮</span>
      <span>实线 = 前置依赖</span>
      <span>虚线 = 知识归属规则</span>
    </div>
    <div id="graph"><svg></svg></div>
  </div>

  <div class="detail-panel" id="detail">
    <div class="empty">点击图中节点，或在左侧提问查看串联路径</div>
  </div>
</div>

<script>
let KB = null;
let nodes = [];
let edges = [];
let selectedId = null;
let matchIds = new Set();

const MODULE_COLORS = {
  Inorganic: '#2563eb', Organic: '#16a34a', ReactionPrinciples: '#7c3aed',
  Experiment: '#f59e0b', Structure: '#dc2626', Technology: '#0891b2'
};
const MODULE_LABEL = {
  Inorganic: '无机', Organic: '有机', ReactionPrinciples: '反应原理',
  Experiment: '实验', Structure: '结构', Technology: '化工'
};

async function init() {
  try {
    const res = await fetch('data/knowledge.json');
    KB = await res.json();
  } catch (e) {
    document.getElementById('graph').innerHTML = '<p style="padding:20px;color:#999">无法加载 knowledge.json，请通过 HTTP 服务访问。</p>';
    return;
  }
  buildGraph();
  render();
  document.getElementById('qBtn').addEventListener('click', doSearch);
  document.getElementById('qInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  updateStats();
}

function buildGraph() {
  nodes = [];
  edges = [];
  // Knowledge nodes
  KB.items.forEach(k => {
    nodes.push({ id: k.id, type: 'kn', name: k.name, module: k.module, data: k,
      x: Math.random() * 800 + 50, y: Math.random() * 500 + 50, vx: 0, vy: 0 });
  });
  // Rule nodes
  KB.rules.forEach(r => {
    nodes.push({ id: r.id, type: 'rule', name: r.name, data: r,
      x: Math.random() * 800 + 50, y: Math.random() * 500 + 50, vx: 0, vy: 0 });
  });
  // Edges: prerequisite (kn -> kn)
  KB.items.forEach(k => {
    (k.prerequisites || []).forEach(pid => {
      if (KB.items.find(i => i.id === pid)) {
        edges.push({ source: pid, target: k.id, type: 'prereq' });
      }
    });
  });
  // Edges: ownership (kn -> rule)
  KB.rules.forEach(r => {
    if (r.knowledgeId) {
      edges.push({ source: r.knowledgeId, target: r.id, type: 'owner' });
    }
  });
  // Initial layout: group by module
  const modules = {};
  KB.items.forEach(k => {
    if (!modules[k.module]) modules[k.module] = [];
    modules[k.module].push(k.id);
  });
  const w = 900, h = 600;
  const cols = 3;
  Object.keys(modules).forEach((m, mi) => {
    const cx = (mi % cols) * (w / cols) + w / cols / 2;
    const cy = Math.floor(mi / cols) * (h / 2) + h / 4;
    modules[m].forEach((id, i) => {
      const n = nodes.find(x => x.id === id);
      const angle = (i / modules[m].length) * Math.PI * 2;
      const r = 80 + modules[m].length * 3;
      n.x = cx + Math.cos(angle) * r;
      n.y = cy + Math.sin(angle) * r;
    });
  });
}

function tick() {
  const w = document.getElementById('graph').clientWidth || 900;
  const h = document.getElementById('graph').clientHeight || 600;
  // Repulsion
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[j].x - nodes[i].x;
      const dy = nodes[j].y - nodes[i].y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      const force = 800 / (dist * dist);
      const fx = (dx / dist) * force;
      const fy = (dy / dist) * force;
      nodes[i].vx -= fx; nodes[i].vy -= fy;
      nodes[j].vx += fx; nodes[j].vy += fy;
    }
  }
  // Attraction along edges
  edges.forEach(e => {
    const a = nodes.find(n => n.id === e.source);
    const b = nodes.find(n => n.id === e.target);
    if (!a || !b) return;
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const target = e.type === 'prereq' ? 120 : 70;
    const force = (dist - target) * 0.02;
    const fx = (dx / dist) * force, fy = (dy / dist) * force;
    a.vx += fx; a.vy += fy;
    b.vx -= fx; b.vy -= fy;
  });
  // Center gravity
  nodes.forEach(n => {
    n.vx += (w/2 - n.x) * 0.003;
    n.vy += (h/2 - n.y) * 0.003;
    n.vx *= 0.85; n.vy *= 0.85;
    n.x += n.vx; n.y += n.vy;
    n.x = Math.max(30, Math.min(w - 30, n.x));
    n.y = Math.max(30, Math.min(h - 30, n.y));
  });
}

function render() {
  const svg = document.querySelector('#graph svg');
  const w = document.getElementById('graph').clientWidth || 900;
  const h = document.getElementById('graph').clientHeight || 600;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

  // Run a few ticks to settle
  for (let i = 0; i < 60; i++) tick();

  let html = '';
  // Edges
  edges.forEach(e => {
    const a = nodes.find(n => n.id === e.source);
    const b = nodes.find(n => n.id === e.target);
    if (!a || !b) return;
    const isHi = matchIds.has(a.id) && matchIds.has(b.id);
    const isDim = matchIds.size > 0 && !(matchIds.has(a.id) || matchIds.has(b.id));
    const cls = `edge ${e.type} ${isHi ? 'highlight' : ''} ${isDim ? 'dim' : ''}`;
    html += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="${cls}" />`;
  });
  // Nodes
  nodes.forEach(n => {
    const isMatch = matchIds.has(n.id);
    const isDim = matchIds.size > 0 && !isMatch;
    const r = isMatch ? 12 : 8;
    const cls = `node ${n.type} ${isMatch ? 'match' : ''} ${isDim ? 'dim' : ''}`;
    const label = n.type === 'kn' ? (n.data.tier === 1 ? '' : '') : '';
    html += `<g class="${cls}" data-id="${n.id}" transform="translate(${n.x},${n.y})">
      <circle r="${r}" />
      <text y="${r + 12}" fill="${isDim ? '#ccc' : '#555'}">${n.name.length > 8 ? n.name.slice(0,7)+'…' : n.name}</text>
    </g>`;
  });
  svg.innerHTML = html;

  svg.querySelectorAll('.node').forEach(g => {
    g.addEventListener('click', () => selectNode(g.dataset.id));
  });
}

function doSearch() {
  const q = document.getElementById('qInput').value.trim().toLowerCase();
  matchIds = new Set();
  if (!q) { render(); updateStats(); return; }
  const tokens = tokenize(q);
  const kHits = [], rHits = [];
  KB.items.forEach(item => {
    const s = scoreKn(item, tokens);
    if (s > 0) kHits.push({ item, s });
  });
  KB.rules.forEach(rule => {
    const s = scoreRule(rule, tokens);
    if (s > 0) rHits.push({ rule, s });
  });
  kHits.sort((a,b) => b.s - a.s);
  rHits.sort((a,b) => b.s - a.s);
  kHits.slice(0, 8).forEach(h => matchIds.add(h.item.id));
  rHits.slice(0, 8).forEach(h => matchIds.add(h.rule.id));
  // Also add direct neighbors of matched nodes
  const expanded = new Set(matchIds);
  matchIds.forEach(id => {
    edges.forEach(e => {
      if (e.source === id) expanded.add(e.target);
      if (e.target === id) expanded.add(e.source);
    });
  });
  matchIds = expanded;
  render();
  updateStats();
  showChainView(kHits, rHits);
}

function tokenize(q) {
  const tokens = [q];
  if (q.length > 4) for (let i = 0; i <= q.length - 2; i++) tokens.push(q.slice(i, i+2));
  const parts = q.split(/\s+/).filter(Boolean);
  if (parts.length > 1) tokens.push(...parts);
  return [...new Set(tokens)];
}
function scoreKn(item, tokens) {
  const fields = [{t: item.name, w: 10}, {t: item.id, w: 5}, {t: item.pitfall, w: 4}, {t: item.summary, w: 3}];
  for (const f of fields) {
    const s = tokens.reduce((a, t) => a + ((f.t || '').toLowerCase().includes(t) ? f.w : 0), 0);
    if (s > 0) return s;
  }
  return 0;
}
function scoreRule(rule, tokens) {
  const ns = tokens.reduce((a, t) => a + ((rule.name || '').toLowerCase().includes(t) ? 10 : 0), 0);
  if (ns > 0) return ns;
  const ids = tokens.reduce((a, t) => a + ((rule.id || '').toLowerCase().includes(t) ? 5 : 0), 0);
  if (ids > 0) return ids;
  return tokens.reduce((a, t) => a + ((rule.display || '').toLowerCase().includes(t) ? 3 : 0), 0);
}

function selectNode(id) {
  selectedId = id;
  const node = nodes.find(n => n.id === id);
  if (!node) return;
  const detail = document.getElementById('detail');
  if (node.type === 'kn') {
    const k = node.data;
    const prereqs = (k.prerequisites || []).map(pid => {
      const ref = KB.items.find(i => i.id === pid);
      return ref ? `<span class="conn-chip kn" onclick="selectNode('${pid}')">${ref.name}</span>` : '';
    }).join('');
    const rules = (k.rules || []).map(r =>
      `<span class="conn-chip rule" onclick="selectNode('${r.id}')">${r.id} ${r.name}</span>`).join('');
    detail.innerHTML = `
      <span class="badge kn">${k.id}</span>
      <h3>${k.name}</h3>
      <div class="detail-row"><b>模块：</b>${MODULE_LABEL[k.module] || k.module} · ${k.textbookRef}</div>
      <div class="detail-row"><b>要点：</b><p>${k.summary || ''}</p></div>
      ${k.pitfall ? `<div class="detail-row" style="color:#d63031"><b>⚠ 易错：</b><p>${k.pitfall}</p></div>` : ''}
      ${prereqs ? `<div class="detail-row"><b>前置知识：</b><div class="conn-list">${prereqs}</div></div>` : ''}
      ${rules ? `<div class="detail-row"><b>关联规则：</b><div class="conn-list">${rules}</div></div>` : ''}
    `;
  } else {
    const r = node.data;
    const owner = KB.items.find(i => i.id === r.knowledgeId);
    detail.innerHTML = `
      <span class="badge rule">${r.id}</span>
      <h3>${r.name}</h3>
      <div class="detail-row"><b>规则内容：</b><p style="background:#f9f9f9;padding:8px;border-radius:6px">${r.display || ''}</p></div>
      ${owner ? `<div class="detail-row"><b>所属知识点：</b><span class="conn-chip kn" onclick="selectNode('${owner.id}')">${owner.name}</span></div>` : ''}
    `;
  }
}

function showChainView(kHits, rHits) {
  const detail = document.getElementById('detail');
  if (kHits.length === 0 && rHits.length === 0) {
    detail.innerHTML = '<div class="empty">未找到相关知识点，请尝试其他关键词。</div>';
    return;
  }
  let html = '<h3>🔗 提问串联路径</h3>';
  html += '<div class="chain-view"><div class="step"><b>你的问题</b> → 关键词匹配</div>';
  if (kHits.length > 0) {
    html += `<div class="step"><b>命中知识点</b><span class="arrow">↓</span></div>`;
    kHits.slice(0, 5).forEach(h => {
      html += `<div class="step">📖 <b>${h.item.name}</b> <span style="color:#999">(${h.item.id})</span> — ${h.item.summary || ''}</div>`;
      // 展示该知识点的全部关联规则（体现知识→规则串联）
      const relatedRules = (h.item.rules || []).slice(0, 5);
      if (relatedRules.length > 0) {
        relatedRules.forEach(r => {
          html += `<div class="step" style="padding-left:20px">└─ 📐 <b>${r.name}</b> <span style="color:#999">(${r.id})</span> — ${r.display || ''}</div>`;
          matchIds.add(r.id);
        });
      }
    });
  }
  if (rHits.length > 0) {
    html += `<div class="step"><b>直接命中规则</b><span class="arrow">↓</span></div>`;
    rHits.slice(0, 5).forEach(h => {
      const owner = KB.items.find(i => i.id === h.rule.knowledgeId);
      html += `<div class="step">📐 <b>${h.rule.name}</b> <span style="color:#999">(${h.rule.id})</span> — ${h.rule.display || ''}${owner ? ` <span style="color:#7c3aed">[归属: ${owner.name}]</span>` : ''}</div>`;
    });
  }
  html += '<div class="step" style="color:var(--ok)">✓ 知识点 → 关联规则 → 结论，全部可溯源</div></div>';
  html += '<p style="font-size:12px;color:var(--muted);margin-top:12px">点击图中节点查看详情，或点击下方标签跳转：</p>';
  html += '<div class="conn-list">';
  kHits.slice(0, 5).forEach(h => { html += `<span class="conn-chip kn" onclick="selectNode('${h.item.id}')">${h.item.name}</span>`; });
  rHits.slice(0, 5).forEach(h => { html += `<span class="conn-chip rule" onclick="selectNode('${h.rule.id}')">${h.rule.name}</span>`; });
  html += '</div>';
  detail.innerHTML = html;
  render(); // 重新渲染以高亮新增的关联规则节点
}

function updateStats() {
  const knCount = KB.items.length;
  const ruleCount = KB.rules.length;
  const edgeCount = edges.length;
  const matchCount = matchIds.size;
  document.getElementById('stats').innerHTML =
    `<b>${knCount}</b> 知识点 · <b>${ruleCount}</b> 规则 · <b>${edgeCount}</b> 关联边${matchCount > 0 ? ` · <b style="color:var(--accent)">${matchCount}</b> 命中节点` : ''}`;
}

// Redraw on resize
window.addEventListener('resize', () => render());

init();
</script>
</body>
</html>
